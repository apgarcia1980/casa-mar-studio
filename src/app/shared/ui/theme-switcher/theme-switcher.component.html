<fieldset class="theme-switcher">
  <legend>{{ i18n.t('theme.label') }}</legend>
  <div class="options">
    @for (theme of themes; track theme) {
      <button
        type="button"
        [attr.aria-pressed]="themeService.theme() === theme"
        [attr.aria-label]="label(theme)"
        (click)="select(theme)"
      >
        {{ label(theme) }}
      </button>
    }
  </div>
</fieldset>
