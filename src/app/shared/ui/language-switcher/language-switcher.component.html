<div class="language-switcher" role="group" [attr.aria-label]="i18n.t('language.label')">
  @for (option of options(); track option.locale; let last = $last) {
    @if (option.path) {
      <a
        [routerLink]="option.path"
        [hreflang]="option.locale"
        [lang]="option.locale"
        [attr.aria-label]="labelFor(option.locale)"
        [attr.aria-current]="locale() === option.locale ? 'page' : null"
        >{{ option.locale.toUpperCase() }}</a
      >
    }
    @if (!last) {
      <span aria-hidden="true">/</span>
    }
  }
</div>
